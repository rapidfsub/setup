version: "3"

tasks:
  switch:
    aliases: [s]
    cmds:
      - sudo darwin-rebuild switch --flake .#$(uname -m)

  update:
    aliases: [u]
    cmds:
      - nix flake update
      - task: switch

  collect-garbage:
    aliases: [gc]
    cmds:
      - nix-env --delete-generations old
      - nix-store --gc
      - nix-collect-garbage -d
