c = ['exec-and-forget open -b com.openai.atlas', 'mode normal']
f = ['exec-and-forget open -a Firefox.app', 'mode normal']
g = ['exec-and-forget open -a Ghostty.app', 'mode normal']
k = ['exec-and-forget open -a KakaoTalk.app', 'mode normal']
